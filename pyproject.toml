[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speculative-edge-rag"
version = "0.1.0"
description = "Mock experimental framework for resource-aware edge RAG and multi-draft speculative decoding"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
